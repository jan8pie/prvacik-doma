<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprievodca – Prváčik doma</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="pismo.css">
<style>
:root{--bg:#EDF1F5;--card:#FFFFFF;--ink:#1C2633;--muted:#5A6676;--line:#D8DFE7;
  --f-head:"Lexend","Trebuchet MS",system-ui,sans-serif;--f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171E;--card:#1B222C;--ink:#E7ECF2;--muted:#9AA6B5;--line:#2D3745;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171E;--card:#1B222C;--ink:#E7ECF2;--muted:#9AA6B5;--line:#2D3745;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding:20px 16px 60px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-head);margin:0}h1{font-size:26px}h2{font-size:18px}
p{margin:0;color:var(--muted);max-width:62ch}
a{color:inherit}
.mriezka{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.poza{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.poza .sprv{width:130px}
.poza b{font-family:var(--f-head);font-weight:600}
.poza span{font-size:14px;color:var(--muted)}
.rad{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tmava{background:#1B222C;border-color:#2D3745}
.farba{background:#2B62C9;border-color:#2B62C9}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html">← Prváčik doma</a>
  <h1>Sprievodca: veverička</h1>
  <p>Pôvodná postavička stránky. Jedna kresba v súbore <code>sprievodca.js</code>, šesť póz. Ďalšie pózy sa dajú doplniť výmenou rúk, očí a úst.</p>
  <div class="mriezka" id="pozy"></div>
  <h2>Len hlava (malé miesta)</h2>
  <div class="rad" id="hlavy"></div>
  <h2>Veľkosti a zrkadlenie</h2>
  <div class="rad" id="velkosti"></div>
  <h2>Na tmavom a farebnom pozadí</h2>
  <div class="rad tmava" id="tmave"></div>
  <div class="rad farba" id="farebne"></div>
</div>
<script src="sprievodca.js"></script>
<script>
const POPIS={ahoj:["Ahoj","víta, máva"],chvali:["Chváli","správna odpoveď, hotovo"],rozmysla:["Rozmýšľa","nápoveda, otázka"],
  ukazuje:["Ukazuje","„pozri sem“, tip"],skus:["Skús znova","chyba, bez plaču"],oriesok:["Oriešok","odmena na konci"]};
const S=window.SPRIEVODCA;
document.getElementById("pozy").innerHTML=S.pozy.map(p=>`<div class="poza">${S.svg(p,{popis:"Veverička: "+POPIS[p][0]})}<b>${POPIS[p][0]}</b><span>${POPIS[p][1]}<br><code>"${p}"</code></span></div>`).join("");
document.getElementById("hlavy").innerHTML=S.pozy.slice(0,5).map(p=>S.svg(p,{hlava:true})).join("");
document.getElementById("velkosti").innerHTML=[48,80,120,170].map(w=>S.svg("ahoj").replace("<svg ",`<svg style="width:${w}px" `)).join("")+S.svg("ukazuje")+S.svg("ukazuje",{vpravo:true});
document.getElementById("tmave").innerHTML=["ahoj","chvali","rozmysla","skus"].map(p=>S.svg(p)).join("");
document.getElementById("farebne").innerHTML=["ukazuje","oriesok","chvali"].map(p=>S.svg(p)).join("");
</script>
</body>
</html>
