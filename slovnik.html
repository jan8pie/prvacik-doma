<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obrázkový slovník · Prváčik doma</title>
<meta name="description" content="Obrázkový slovník angličtiny pre prvákov: dieťa ťukne na obrázok, tablet slovo pomaly povie a napísané slovo ukáže až potom, len na chvíľu. Slová po lekciách učebnice Beehive Starter.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="pismo.css">
<link rel="stylesheet" href="hlavicka.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikony/ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikony/ikona-180.png">
<link rel="stylesheet" href="slovnik.css?v=6">
</head>
<body>
<div class="sl-wrap">
  <a class="sl-spat hl-spat" href="./">← Prváčik doma</a>
  <header class="sl-head">
    <div class="sl-title"><span class="sl-tag">Angličtina</span><h1>Obrázkový slovník</h1></div>
    <button class="sl-rodic" id="btnRodic" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Pre rodiča</button>
  </header>
  <div class="sl-oznam" id="oznam" hidden></div>
  <nav class="sl-temy" id="temy" aria-label="Lekcie"></nav>
  <h2 class="sl-lekcia" id="lekcia"></h2>
  <div class="sl-volby" id="volby">
    <div class="sl-seg sl-rozsah" role="group" aria-label="Ktoré slová ukázať">
      <button type="button" data-spolu="0" aria-pressed="true">Len táto lekcia</button>
      <button type="button" data-spolu="1" aria-pressed="false">Od začiatku</button>
    </div>
    <div class="sl-seg sl-urovne" role="group" aria-label="Koľko slov">
      <button type="button" data-uroven="1" aria-pressed="true">Základ</button>
      <button type="button" data-uroven="2" aria-pressed="false">Viac <small></small></button>
      <button type="button" data-uroven="3" aria-pressed="false">Najviac <small></small></button>
    </div>
    <button class="sl-prep" type="button" data-prep="vety" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Vety<small>veta len zvukom</small></button>
    <button class="sl-prep" type="button" data-prep="sk" aria-pressed="false"><span class="sw" aria-hidden="true"></span>SK<small>aj po slovensky</small></button>
  </div>
  <p class="sl-pokyn" id="pokyn">Ťukni na obrázok. Tablet povie slovo po anglicky.</p>
  <main class="sl-mriezka" id="mriezka"></main>
</div>

<script src="anj-slova.js?v=7"></script>
<script src="slovnik.js?v=7"></script>
</body>
</html>
